name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request cancels the run of its old head. A push to main is grouped by
# its own commit, so every commit of main is run to the end and none waits on another.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request that changes only `docs/` builds and tests nothing: no code, test or
  # build reads `docs/` (checked 2026-11-13 — the tests read `src/`, `src-tauri/src/`,
  # `tests/` and `ROME_375_SCENARIO.md`, never `docs/`). A job skipped by its `if` counts
  # as passed for a required check. Any other file — a root `.md` included — runs it all,
  # and a push to main always runs it all.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE"..."$HEAD")
          echo "$changed"
          if [ -n "$changed" ] && ! echo "$changed" | grep -qv '^docs/'; then
            echo "only docs/ changed: nothing to build or test"
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  # The workspace's tests and the three clippy runs. engine2's long runs are the two jobs
  # below, so the three go side by side instead of one after another.
  rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-features -- -D warnings
      - run: cargo clippy --workspace -- -D warnings
      # The B44 census (`core::census`, `dead_read_probe`) builds only with its feature;
      # without this line nothing compiles it and the instrument rots unseen.
      - run: cargo clippy --workspace --features census -- -D warnings

  # The sentinel (brief §6) measures engine2 behind a feature, so the game's build never
  # carries it; this line is the short run in CI (plan §8).
  engine2:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p engine2 --all-features

  # The full matrix of generated worlds — 200 seeds × 300 ticks — was a manual step before
  # every merge and caught defects three times; it went into CI at 18 s with the build (owner
  # on #285). With the bots it takes about 8 minutes, so it runs as its own job, beside the
  # others, and still depends on nobody's memory.
  worldgen-200:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release -p engine2 --all-features --test worldgen -- --ignored

  tauri:
    # Крейт src-tauri не входит в воркспейс, поэтому `cargo test --workspace`
    # его не видит. Это единственная проверка живого кода приложения.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # tauri-build читает frontendDist: ../dist — каталога нет в репозитории
      - run: npm run build
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # clippy compiles the crate too, so it replaces the former `cargo check` (B33).
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  frontend:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
