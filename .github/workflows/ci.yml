name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo clippy --workspace -- -D warnings
      # The B44 census (`core::census`, `dead_read_probe`) builds only with its feature;
      # without this line nothing compiles it and the instrument rots unseen.
      - run: cargo clippy --workspace --features census -- -D warnings

  tauri:
    # Крейт src-tauri не входит в воркспейс, поэтому `cargo test --workspace`
    # его не видит. Это единственная проверка живого кода приложения.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # tauri-build читает frontendDist: ../dist — каталога нет в репозитории
      - run: npm run build
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # clippy compiles the crate too, so it replaces the former `cargo check` (B33).
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
