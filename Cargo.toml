# engine2 (new engine, docs/engine2_brief.md) lives in the workspace; `src-tauri` does not:
# it sits inside this directory, declares no workspace of its own and depends on the root
# crate by path, so without `exclude` cargo refuses to build it (AGENTS.md, engine2_e1_plan §0).
[workspace]
members = ["engine2", "sentinel"]
exclude = ["src-tauri"]

# The engine2 tests run many worlds (20 x 300 ticks in the measures of E2, more under
# `--ignored`): unoptimized they take ~545 s of a ~773 s CI chain, optimized the same run is
# a fraction of that. Only the crate is optimized, its tests and the rest of the workspace
# stay at the dev defaults, so the build grows little (chain timed before and after in the PR
# that added this).
[profile.dev.package.engine2]
opt-level = 2

[package]
name = "engine13"
version = "0.1.0"
edition = "2021"

[features]
# B44 census of reads on absent actors (src/core/census.rs). Probe builds only.
census = []

[dependencies]
serde = { version = "1.0.193", features = ["derive"] }
serde_json = { version = "1.0.108", features = ["float_roundtrip"] }  # load must restore f64 bit-exact (B31)
toml = "0.8"
thiserror = "1.0.50"
reqwest = { version = "0.11", features = ["json", "stream", "blocking"] }
tokio = { version = "1", features = ["full"] }
dirs = "5.0"
rand = "0.8"
rand_chacha = "0.3"
futures-util = "0.3"
tauri = { version = "2" }
bytes = "1"
rusqlite = { version = "0.31", features = ["bundled"] }

