[package]
name = "engine13"
version = "0.1.0"
edition = "2021"

[features]
# B44 census of reads on absent actors (src/core/census.rs). Probe builds only.
census = []

[dependencies]
serde = { version = "1.0.193", features = ["derive"] }
serde_json = { version = "1.0.108", features = ["float_roundtrip"] }  # load must restore f64 bit-exact (B31)
toml = "0.8"
thiserror = "1.0.50"
reqwest = { version = "0.11", features = ["json", "stream", "blocking"] }
tokio = { version = "1", features = ["full"] }
dirs = "5.0"
rand = "0.8"
rand_chacha = "0.3"
futures-util = "0.3"
tauri = { version = "2" }
bytes = "1"
rusqlite = { version = "0.31", features = ["bundled"] }

[[bin]]
name = "dead_read_probe"
required-features = ["census"]

[[bin]]
name = "condition_occupancy_probe"
required-features = ["census"]

[[bin]]
name = "a37_probe"
required-features = ["census"]

[[bin]]
name = "a46_probe"
required-features = ["census"]

[[bin]]
name = "a46_readers_probe"
required-features = ["census"]
