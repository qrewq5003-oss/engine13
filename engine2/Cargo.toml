[package]
name = "engine2"
version = "0.1.0"
edition = "2021"
description = "ENGINE13 new engine (docs/engine2_brief.md): systems in the engine, scenarios as data"

[dependencies]
serde = { version = "1.0.193", features = ["derive"] }
# Load must restore f64 bit-exact (lesson B31 of the old engine).
serde_json = { version = "1.0.108", features = ["float_roundtrip"] }
rand_chacha = "0.3"
rand = "0.8"
thiserror = "1.0.50"
toml = "0.8"
# The sentinel is a measuring instrument, not part of the game: behind a feature so the
# shell's build (E5) never carries it. CI enables it for the short run.
sentinel = { path = "../sentinel", optional = true }

[features]
sentinel = ["dep:sentinel"]
# The world generator is a measuring instrument for E2 acceptance, not a game mode (the
# brief has none): behind a feature, out of the game's build.
worldgen = []
# `Game::world_mut` for the acceptance tests that inject stocks and give orders before the
# verbs of E3 exist; never on in a game build.
testing = []

[[test]]
name = "sentinel_short_run"
required-features = ["sentinel"]

[[test]]
name = "worldgen"
required-features = ["sentinel", "worldgen"]

[[test]]
name = "units"
required-features = ["worldgen", "testing"]

[[test]]
name = "population"
required-features = ["sentinel", "worldgen", "testing"]

[[test]]
name = "economy"
required-features = ["worldgen", "testing"]

[[test]]
name = "army"
required-features = ["worldgen", "testing"]

[[test]]
name = "politics"
required-features = ["worldgen", "testing"]

[[test]]
name = "legitimacy"
required-features = ["worldgen", "testing"]

[[test]]
name = "diplomacy"
required-features = ["worldgen", "testing"]
