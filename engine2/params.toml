# E0 В4 — births: 4–6 legitimate children per ruler, i.e. per couple, over a reproductive
# life (Kokkonen, Krishnarajan, Møller, Sundell, JOP 83/4 (2021) — открыл, E0 §5.8: 27
# monarchies 1000–1799, 22 % of monarch-years with five children or more and 38 % with
# none; the mean is not in the text and the Dataverse is not opened — the band stays by
# memory). The model has
# no sex and no marriage: each person is the one parent of its children, and the half of the
# children that marries out of the house (the daughters) is not modelled — so the row is
# В4 ÷ 2 per person, over the fertile window 16–45 (29 years) the unit is defined on:
# 2–3 ÷ 29 = 0.069–0.103 a year. The value sits at the bottom of the band — four children
# per couple — because the owner's rule on §18 asks for about one adult descendant per
# member over a life (neither a house that doubles every generation nor one that always
# dies out), and with the elite factor above that is what the bottom gives (median house
# 4 → 6 over 150 years on the generated worlds; the middle of the band gives 4 → 16).
