# engine2 constants — one table for every scenario (brief §0.2, §2; E0 §1 and §5).
#
# Every entry carries its kind (owner's rule, plan §1):
#   kind = "a"  engine input with a historical source: `value` inside `band` (E0 §5) and
#               `e0` naming the E0 §5 row the band comes from — without a source no entry;
#   kind = "b"  observed bound the engine must *produce*: `band` and `e0` only, measured by
#               E2 and the sentinel, never read as an input;
#   kind = "c"  model parameter without a source: `value` and `checked_by` naming the `e0`
#               of a (b) row in this file.
# Units are written out; the engine converts to per-tick and to thousandths itself.

# E0 П1 — land capacity, people per km² (Scheidel 2007 via Frier; Russell; Khazanov).
[capacity.arable]
kind = "a"
value = 40.0
band = [26.0, 42.0]
unit = "people per km²"
e0 = "П1"

[capacity.hills]
kind = "a"
value = 12.0
band = [8.0, 19.0]
unit = "people per km²"
e0 = "П1"

[capacity.steppe]
kind = "a"
value = 1.0
band = [0.5, 2.0]
unit = "people per km²"
e0 = "П1"

[capacity.desert]
kind = "a"
value = 0.5
band = [0.1, 1.0]
unit = "people per km²"
e0 = "П1"

# E0 П2 — intrinsic growth below capacity (derived from the observed П7: the recovery peak
# of 0.4–0.5 % a year must be reachable, so r sits above it).
[population.growth_per_year]
kind = "a"
value = 0.007
band = [0.005, 0.010]
unit = "share per year, logistic toward capacity"
e0 = "П2"

# E0 П3 — famine: the share a province above its capacity loses (Jordan 1996; Ó Gráda 2009).
[famine.mortality_per_year]
kind = "a"
value = 0.10
band = [0.05, 0.20]
unit = "share of the province per crisis year"
e0 = "П3"

# E0 П4 — plague where the world has it. Whether plague exists is a fact of the scenario
# (its pool of diseases), not a constant. **Level matters (owner's review of PR #282):** E0
# gives the *urban* outbreak (10–20 % of a city) and Europe-wide recurrence (somewhere,
# every 2–20 years); a province is a city and its countryside, and a province sees only its
# own outbreaks.
#   frequency — one city's catalogue: Florence 1400, 1411, 1417, 1424, 1430, 1437, 1449,
#   1457, 1464, 1479 ≈ 10 outbreaks a century (Biraben 1975 vol. 1; Del Panta 1980;
#   Carmichael 1986 — by memory, to open before E4), hence 0.08 per province-year, band
#   0.05–0.15 (every 7–20 years);
#   mortality — urban share × urban outbreak, countryside largely spared: 15th-century
#   plague had become an urban disease of the poor (Carmichael 1986, ch. 3–4); urban share
#   of Italy c. 1500 ≈ 20 % (Malanima 2005 — by memory); 0.2 × 10–20 % = 2–4 % of the
#   province, value 0.03, band 0.02–0.05.
# Check: 0.08 × 0.03 = 0.24 % a year lost, below the П2 growth of 0.7 % — a plague world
# settles near two thirds of capacity instead of dying out (the loader refuses constants
# whose mean plague loss exceeds the growth: extinction would then be written in them).
[plague.outbreaks_per_year]
kind = "a"
value = 0.08
band = [0.05, 0.15]
unit = "outbreaks per province per year"
e0 = "П4"

[plague.mortality]
kind = "a"
value = 0.03
band = [0.02, 0.05]
unit = "share of the province per outbreak (urban share × urban outbreak)"
e0 = "П4"

# E0 П5 — migration, kind (в): people move toward an emptier land neighbour; the sum of
# people never changes (ledger). Checked through П7.
[migration.rate_per_tick]
kind = "c"
value = 0.02
unit = "share of the fuller province per tick, times the fill gap"
checked_by = "П7"

[migration.min_gap]
kind = "c"
value = 0.10
unit = "fill gap (share of capacity) below which nobody moves"
checked_by = "П7"

[population.observed_growth_per_year]
kind = "b"
band = [-0.002, 0.005]
unit = "share per year"
e0 = "П7"

# E0 А8 — soldiers the polity's economy can sustain per 1 000 inhabitants (Э8 × Э2, with
# Roth 1999 for the ration): a polity-wide ratio. Until the economy exists it stands in for
# local supply by the province a unit occupies — a placeholder, not the design (plan §14).
[supply.soldiers_per_1000_people]
kind = "a"
value = 150.0
band = [90.0, 200.0]
unit = "soldiers per 1 000 inhabitants"
e0 = "А8"

# E0 А7 — attrition of an unsupplied unit (Parker 1972: 2–3 % a month in the field).
[army.attrition_unsupplied_per_year]
kind = "a"
value = 0.30
band = [0.25, 0.35]
unit = "share of the unsupplied soldiers, per year"
e0 = "А7"

# E0 А11 — standing army as a share of population (Jones; Treadgold; Mallett–Hale).
[army.observed_share_of_population]
kind = "b"
band = [0.005, 0.03]
unit = "soldiers per inhabitant"
e0 = "А11"

# E0 А12 — share of years a polity spends at war (Ammianus; Mallett).
[war.observed_share_of_years]
kind = "b"
band = [0.2, 0.9]
unit = "share of years"
e0 = "А12"

# E0 А5 — provinces a unit crosses per tick. A placeholder: 1 per half-year tick makes the
# march the main brake on war; the war system derives the value from А5 (15–25 km a day,
# a 6–8 month season) and the province area (owner's note on PR #281). Checked through А12.
[movement.provinces_per_tick]
kind = "c"
value = 1.0
unit = "provinces per tick"
checked_by = "А12"
