# milan_1477: the scenario's own facts — polities, houses, persons, relations, aspirations.
# The provinces and the regions are in provinces.toml (tools/map/layout.py); the engine joins
# the two texts (`ScenarioData::parse_parts`). Written by hand by the cartographer; every fact
# has its source in docs/engine2_map.md §19, §23, §25.
#
# The state of the start is the first half of 1477 (tick 0): after 9 January, when Bona of
# Savoy took the wardship of the duke, and with Prospero Adorno the ducal governor of Genoa
# (from 11 April). No rule number and no date after 1477: the schema has no place for either.
#
# Sources of the years of birth: DBI — Dizionario Biografico degli Italiani (treccani.it);
# EI — Enciclopedia Italiana (treccani.it, 1930–1934); EdP — Enciclopedia dei Papi (2000).
#
# STUBS — what no opened source gives, written so that the scenario loads (§25.3):
#   - the rulers of Siena, Lucca, Ragusa and the Confederation are offices, not persons: no
#     single ruler, and the holder of the start of 1477 is not opened; born = 1440 is the stub
#     of the map's test, not a fact;
#   - EI's year against it.wikipedia: Mehmed II (EI 1430, there 1432), Matthias Corvinus (EI
#     «probably 1440», there 1443), John II of Aragon (EI 1397, there 1398) — EI's is written.
#
# treasury_kg = 0 everywhere: no source names cash in hand (owner's decision 2026-11-17).
# soldiers — only where a source gives the army (Mallett 1974): Milan and Venice; the rest is
# left to the engine's rule (owner's decision 2026-11-17). Houses' own men — 0: no source.

id = "milan_1477"
start_year = 1477
diseases = ["Plague"]

# A ducat buys about 100 kg of wheat: Florence in the 1470s, a florin for 80–120 kg (E0 Э1б).
[display_currency]
name = "дукат"
kg_per_unit = 100.0

# Every verb of the engine: the bots act only by the verbs a scenario turns on.
[verbs]
recruit = "Набрать войско"
disband = "Распустить войско"
hire_mercenaries = "Нанять кондотьеров"
declare_war = "Объявить войну"
make_peace = "Заключить мир"
propose_alliance = "Предложить союз"
propose_marriage = "Предложить брак"
bribe = "Послать дар"
take_loan = "Взять заём"
raise_tax = "Поднять налог"
lower_tax = "Снизить налог"
enforce_order = "Навести порядок"
send_embassy = "Отправить посольство"

# ---------------------------------------------------------------- relations at the start
# Venice and the Ottomans at war: from 1463–64, peace on 25 April 1479 (DBI, Vendramin).
#
# The league of Florence, Milan and Venice: signed on 2 November 1474, defensive, for twenty-five
# years (Sismondi, Storia delle repubbliche italiane, 1832; Zanotto, Il Palazzo ducale di
# Venezia, 1853) — to 1499, the term of the treaty as it stood in 1477, not what became of it.
# In 1477 it was in force: Milan and Venice «erano ancora alleate» (DBI, Ercole I d'Este).
# The schema's alliance is a pair, so three powers are three pairs (К15).
# Mantua: Ludovico Gonzaga signed the same pact at Mantua on 18 November 1474 «come aderente
# del duca di Milano» (DBI, Ludovico III Gonzaga) — a pair with Milan alone (К16).
# Ferrara: «l'alleanza tra Milano, Venezia, Firenze e Ferrara» (DBI, Ercole I d'Este); the day
# of its accession is not opened, the term is the league's (К17).
# Not written: Montferrat — the marquis served Milan by a condotta, which is not an alliance
# and has no term; the understanding of the pope and Naples — no treaty opened (§26.4).
# No vassals: none who paid and fought by an opened source.
[relations]
wars = [["venice", "ottomans"]]
alliances = [
    { a = "florence", b = "milan", until_year = 1499 },
    { a = "milan", b = "venice", until_year = 1499 },
    { a = "florence", b = "venice", until_year = 1499 },
    { a = "mantua", b = "milan", until_year = 1499 },
    { a = "ferrara", b = "milan", until_year = 1499 },
    { a = "ferrara", b = "venice", until_year = 1499 },
    { a = "ferrara", b = "florence", until_year = 1499 },
]
vassals = []

# ---------------------------------------------------------------- Milan
# Liguria and Corsica are Milan's (owner's decision 2026-11-17, К4). The army — Mallett 1974,
# «a permanent army of well over 20,000 men» in 1472–1474: the lower end.
[actors.milan]
name = "Миланское герцогство"
treasury_kg = 0
capital = "milano"
soldiers = 20000
institutions = []
ruler = "gian_galeazzo_sforza"
heir = "ermes_sforza"
regent = "bona_di_savoia"
succession = "Blood"
# E0 §6.3: «удержать Ломбардию против Венеции» — its own provinces there. Not the region
# `lombardia`: it holds `bergamo` and `brescia` of Venice and `mantova` of the marquis, and to
# hold a region not wholly one's own is, in the engine, to make war for the rest (К20).
