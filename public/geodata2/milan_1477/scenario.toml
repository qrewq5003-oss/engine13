    { kind = "Hold", target = "milano" },
    { kind = "Hold", target = "pavia" },
    { kind = "Hold", target = "cremona" },
    { kind = "Hold", target = "parma" },
    { kind = "Hold", target = "alessandria" },
    { kind = "Hold", target = "novara" },
    { kind = "Hold", target = "como" },
    { kind = "Hold", target = "ossola" },
    { kind = "Hold", target = "valtellina" },
]

