# NOTE: `mehmed_accelerates`, `outcome_fell_federation` and `outcome_historical`
# below use `metric = "global:federation_progress"` with no `actor_id`. This
# is a supported form as of ENGINE13_INFRASTRUCTURE_TASKS.md Задача 4:
# `check_event_condition`/`check_rank_conditions` now route metric conditions
# through the shared `eval_metric_condition`, which resolves `global:`/
# `family:`/`actor:` scopes via `MetricRef` exactly like `victory_condition`
# already did. Before that fix these three milestones were silently dead
# (an unscoped `actor_id = None` condition returned false unconditionally).

[[milestone_events]]
id = "church_union"
is_key = true
triggers_collapse = false
llm_context_shift = "Уния церквей подписана. Папа обещает помощь. Православные недовольны."
# A9 (owner's decision): a historical date — the Council of Florence, 1439, tick 18.
# The union is the scenario's premise, concluded for the West's help whatever that help
# turns out to be — not a result of play. `byzantium.legitimacy > 65` fired 0 of 120; a
# gate on the federation axis fired on the same tick in every seed (the start rush holds
# federation above 50–60 until ~tick 21) or, above 80, over a fallen Byzantium. Same
# precedent as `huns_visible` (A3). The milestone carries text only, no mechanics.
[milestone_events.condition]
type = "tick"
tick = 18

[[milestone_events]]
id = "varna_crusade"
is_key = true
triggers_collapse = false
llm_context_shift = "Варненский крестовый поход собран. Венгрия ведёт католиков против осман."
[milestone_events.condition]
type = "metric"
metric = "military_size"
actor_id = "hungary"
operator = "greater"
value = 60.0
duration = 2

[[milestone_events]]
id = "mehmed_accelerates"
is_key = true
triggers_collapse = false
# B46: over a fallen city it fired in 22 of 22 no-player games.
requires_alive = ["byzantium"]
llm_context_shift = "Мехмед форсирует подготовку. Федерация работает — османы торопятся."
[milestone_events.condition]
type = "metric"
metric = "global:federation_progress"
operator = "greater"
value = 60.0
duration = 2

[[milestone_events]]
id = "mehmed_rises"
is_key = true
triggers_collapse = false
requires_alive = ["byzantium"]
llm_context_shift = "Мехмед II восходит на трон. Молодой амбициозный султан."
[milestone_events.condition]
type = "metric"
metric = "military_size"
actor_id = "ottomans"
operator = "greater"
value = 250.0
duration = 5

[[milestone_events]]
id = "final_assault"
is_key = true
# B46: the start of the assault is not yet the end — `constantinople_falls` ends the scenario.
triggers_collapse = false
requires_alive = ["byzantium"]
llm_context_shift = "Финальный штурм Константинополя начался."
[milestone_events.condition]
type = "metric"
metric = "military_size"
actor_id = "ottomans"
operator = "greater"
value = 280.0
duration = 3

[[milestone_events]]
id = "constantinople_holds"
is_key = true
triggers_collapse = false
# B46: «held, unconquerable» only after an assault beaten off. On cohesion alone it fired on
# ticks 9–17 of every game, before any assault; until A8 makes the assault reachable it is
# expected to stay silent — more honest than a false claim.
after = "final_assault"
requires_alive = ["byzantium"]
llm_context_shift = "Константинополь выстоял! Город непобедим."
[milestone_events.condition]
type = "metric"
metric = "cohesion"
actor_id = "byzantium"
operator = "greater"
value = 70.0
duration = 5

# B46 (решение владельца 2026-10-03): концовки — таблица 2×2 «город пал / выстоял» ×
# «федерация сложилась / нет». Каждая оценивается один раз, в свой решающий момент, и за
# партию срабатывает не больше одной (`group = "ending"`). «Сложилась при живом городе» —
# это победа: она закрывает группу, а прежний `outcome_best` удалён, его текст — в описании
# победы. Решающие моменты: падение — сама гибель Византии; «выстоял» — 1453 год, тик 46.

[[milestone_events]]
id = "constantinople_falls"
is_key = true
triggers_collapse = true
llm_context_shift = "Константинополь пал."
[milestone_events.condition]
type = "actor_state"
actor_id = "byzantium"
state = "dead"

[[milestone_events]]
id = "outcome_survived_alone"
is_key = true
triggers_collapse = false
llm_context_shift = "Город выстоял — но случайно. Разрозненная помощь, никакой координации. Ottoman отступил но не сломлен. Через десять лет попробует снова."
group = "ending"
requires_alive = ["byzantium"]
[milestone_events.condition]
type = "tick"
tick = 46

[[milestone_events]]
id = "outcome_fell_federation"
is_key = true
triggers_collapse = false
llm_context_shift = "Константинополь пал. Но федерация выжила. Греческие учёные бегут на север — в Венецию, в Милан. Знания, рукописи, мастера. Ренессанс ускоряется. Север Италии выигрывает от трагедии которую не смог предотвратить."
after = "constantinople_falls"
group = "ending"
[milestone_events.condition]
type = "metric"
metric = "global:federation_progress"
operator = "greater_or_equal"
value = 80.0

[[milestone_events]]
id = "outcome_historical"
is_key = true
triggers_collapse = false
llm_context_shift = "Исторический исход. Город пал. Федерация не сложилась. Ottoman давит на Адриатику. Венеция платит дань. Генуя теряет Галату. Милан смотрит в сторону."
after = "constantinople_falls"
group = "ending"
[milestone_events.condition]
type = "metric"
metric = "global:federation_progress"
operator = "less"
value = 80.0

[[milestone_events]]
id = "wallachia_emerges"
# A31 (решение владельца 2026-09-29): Валахия в 1430 году уже есть, поэтому веха —
# описание положения на старте, а не перемена. Прежнее условие
# `ottomans.military_size > 70` при стартовых 180 было тем же тиком 0 под видом порога.
is_key = false
triggers_collapse = false
llm_context_shift = "Валахия — дунайское пограничье между Венгрией и Портой; её господари лавируют между двумя дворами."
cooldown_ticks = 999
[milestone_events.condition]
type = "tick"
tick = 0
[milestone_events.spawn_actor]
# Identity (A32, решение владельца 2026-09-28): церковь и канцелярия церковнославянские; политически — православно-славянский мир; ранг C — провинция, которая сама себя кормит.
region_rank = "C"
religion = "orthodox"
culture = "slavic"
actor_id = "wallachia"
label = "Валахия"
lat = 44.4
lng = 26.1
color = "#5d4037"
# Задача 25, стадия 2, вариант (D₂): `military_quality` — единственный из четырёх
# ключей, которых у этого спавна нет, чей интервал непуст и безопасен. Значение 50
# не выбрано, а выведено тремя независимыми путями, сходящимися в одну точку:
#   1. это объявленный движком ответ на вопрос «что имеет актор, у которого метрика
#      не названа» — `core::actor::default_metrics()`; он существует и не применяется
#      ни на одном пути входа в мир (`ensure_default_metrics` имеет ровно один вызов,
#      и на нём инертен);
#   2. это нижняя граница собственной полосы ранга C сценария (`trebizond` 50,
#      `serbia` 55, `byzantium` 55) и минимум `military_quality` во всём сценарии —
#      спавн не становится сильнее ни одного из уже откалиброванных акторов;
#   3. это нижняя граница измеренного безопасного интервала [50, 65], а `military_quality`
#      входит в `power_projection` и через неё удерживает актора в `Foreground`, то есть
#      увеличивает разбавление общего пула — тот самый риск, который назван в §8.2.
# Три остальных ключа НЕ дописываются намеренно: `external_pressure` работает только
# при значении вне шкалы игры, `treasury` имеет практически пустой интервал, а
# `population` открывает гейт `plague`. Разбор — docs/investigation_spawn_completeness.md.
# Рёбра по истории 1430-х, в той же логике, что граф расстояния 1
# (docs/investigation_d1_graph.md §2): Валахия — дунайское пограничье между двумя
# дворами. Влад Дракул инвестирован Сигизмундом Венгерским в 1431 и приносит дань
# Порте с 1436; Дунай — прямая османская граница. Сербское деспотство западнее по
# тому же Дунаю, поэтому d2.
# Тот же документ отклонил `hungary–ottomans` d1 ИМЕННО потому, что «между ними
# Сербия и Валахия» — эти рёбра и есть то, что там названо.
neighbors = [
    { id = "ottomans", distance = 1, border_type = "land" },
    { id = "hungary", distance = 1, border_type = "land" },
    { id = "serbia", distance = 2, border_type = "land" },
]
initial_metrics = { population = 250.0, cohesion = 40.0, legitimacy = 35.0, military_size = 30.0, economic_output = 20.0, military_quality = 50.0 }

[[milestone_events]]
id = "poland_lithuania_intervenes"
is_key = true
triggers_collapse = false
llm_context_shift = "Польша-Литва обратила взор на юг."
cooldown_ticks = 999
[milestone_events.condition]
type = "tick"
tick = 5
[milestone_events.spawn_actor]
# Identity (A32, решение владельца 2026-09-28): держава первого ряда при Ягеллонах; католики, славянская культура.
region_rank = "A"
religion = "catholic"
culture = "slavic"
actor_id = "poland_lithuania"
label = "Польша-Литва"
lat = 52.2
lng = 21.0
color = "#bf360c"
# Рёбра по истории 1430-х. Карпатская граница с Венгрией — прямая, и династическая:
# Владислав III занял венгерский трон в 1440. С Османами в 1430 общей границы НЕТ —
# между ними Молдавия (в сценарии отсутствует) и Валахия; прямое соприкосновение
# только после Килии и Аккермана 1484, поэтому d3.
neighbors = [
    { id = "hungary", distance = 1, border_type = "land" },
    { id = "wallachia", distance = 2, border_type = "land" },
    { id = "ottomans", distance = 3, border_type = "land" },
]
initial_metrics = { population = 700.0, cohesion = 65.0, legitimacy = 70.0, military_size = 60.0, economic_output = 50.0, military_quality = 50.0 }

[[milestone_events]]
id = "mamluks_watch"
is_key = true
triggers_collapse = false
llm_context_shift = "Мамлюки следят за ослаблением Османов."
cooldown_ticks = 999
[milestone_events.condition]
type = "metric"
metric = "cohesion"
actor_id = "ottomans"
operator = "less"
value = 40.0
[milestone_events.spawn_actor]
# Identity (A32, решение владельца 2026-09-28): Бурджиты (черкесы, Барсбай) в 1430; arabic — культура государства и администрации, не turkic бахритского периода.
region_rank = "A"
religion = "muslim"
culture = "arabic"
actor_id = "mamluks"
label = "Мамлюки"
lat = 30.0
lng = 31.2
color = "#f9a825"
# Рёбра по истории 1430-х. С Османами общей границы в 1430 ещё нет: между сирийскими
# владениями султана и османской Анатолией лежат Караманиды и Дулкадириды, прямой
# рубеж только после 1468–1485 — d2. Это ровно тот довод, по которому
# docs/investigation_d1_graph.md §2 отклонил `ottomans–trebizond` d1 («между ними
# Джандариды»).
# Венеция — не сосед по суше, а торговый: александрийская монополия Барсбая
# 1425–1428 била по венецианской торговле пряностями. Море, d2.
neighbors = [
    { id = "ottomans", distance = 2, border_type = "land" },
    { id = "venice", distance = 2, border_type = "sea" },
    { id = "trebizond", distance = 3, border_type = "sea" },
]
initial_metrics = { population = 800.0, cohesion = 55.0, legitimacy = 50.0, military_size = 65.0, economic_output = 45.0, military_quality = 50.0 }
