# Rank bonus rules for Milan 1477 scenario
# Same generic scheme as rome_375/constantinople_1430 - order does not matter, matched by rank

[[rank_bonuses]]
rank = "A"

[[rank_bonuses.effects]]
metric = "economic_output"
delta = 0.3

[[rank_bonuses]]
rank = "B"

[[rank_bonuses.effects]]
metric = "economic_output"
delta = 0.1

[[rank_bonuses]]
rank = "C"

# Ноль здесь — утверждение, а не пропуск. S, A, B — центры, притягивающие богатство;
# D — окраина, из которой оно утекает; C — то, что не притягивает и не теряет:
# провинция, которая сама себя кормит. Пола легитимности C не получает намеренно:
# провинция, теряющая легитимность, должна её терять.
#
# Правило записано явно, потому что ранг C носят 13 авторских акторов в трёх
# сценариях — в rome это 8 из 22, самая большая группа, — и до сих пор таблица его
# не описывала. Поведение не меняется: ровно это и получалось по умолчанию.
[[rank_bonuses.effects]]
metric = "economic_output"
delta = 0.0

[[rank_bonuses]]
rank = "D"

[[rank_bonuses.effects]]
metric = "economic_output"
delta = -0.2
