# Rank bonus rules for Rome 375 scenario
# Order does not matter - rules are matched by rank

[[rank_bonuses]]
rank = "S"

[[rank_bonuses.effects]]
metric = "economic_output"
delta = 0.5

# Пол легитимности ранга S. Ранг S в rome_375 носит ровно один актор — сам Рим,
# так что это правило про протагониста, записанное как правило про класс.
#
# Было 20.0, и при этом значении Рим не гибнет НИ РАЗУ: ворота коллапса требуют
# `legitimacy < 10`, то есть падения больше чем на десять внутри одного тика, три
# тика подряд. Такое падение случается 44 раза на 18 000 актор-тиков (0.24 %), и
# трёх подряд не бывает никогда.
#
# 12.0 — наименьшее значение ПО ТУ СТОРОНУ обрыва, а обрыв стоит ровно на воротах
# (свип 60 сидов, значение правилось в памяти — один бинарник на весь свип):
#
#   пол нет — 50/60 гибелей   пол 12 — 18/60      пол 20 — 0/60
#   пол 10  — 59/60           пол 15 — 14/60
#
# Решает расстояние «пол минус ворота»: 0 — ворота открывает любой сток внутри
# тика; 2 — нужен сток > 2 три тика подряд; 10 — не бывает.
#
# Цена в сыгранной партии — ноль: scripted balanced 30/30, influence 29/30,
# wealth 0/30, как и при 20.0. Игрок уводит легитимность Рима до 93.5 к тику 31,
# и пола не касается вовсе.
#
# Медиана гибели при 12.0 — тик 178…199, то есть 464…474 год против исторического
# 476. Это наблюдение, а не обоснование: до падения доходит меньше трети партий.
#
# Полный разбор: docs/investigation_rome_immortality.md.
[[rank_bonuses.effects]]
metric = "legitimacy"
floor = 12.0

[[rank_bonuses]]
rank = "A"

[[rank_bonuses.effects]]
metric = "economic_output"
delta = 0.3

[[rank_bonuses]]
rank = "B"

[[rank_bonuses.effects]]
metric = "economic_output"
delta = 0.1

[[rank_bonuses]]
rank = "C"

# Ноль здесь — утверждение, а не пропуск. S, A, B — центры, притягивающие богатство;
# D — окраина, из которой оно утекает; C — то, что не притягивает и не теряет:
# провинция, которая сама себя кормит. Пола легитимности C не получает намеренно:
# провинция, теряющая легитимность, должна её терять.
#
# Правило записано явно, потому что ранг C носят 13 авторских акторов в трёх
# сценариях — в rome это 8 из 22, самая большая группа, — и до сих пор таблица его
# не описывала. Поведение не меняется: ровно это и получалось по умолчанию.
[[rank_bonuses.effects]]
metric = "economic_output"
delta = 0.0

[[rank_bonuses]]
rank = "D"

[[rank_bonuses.effects]]
metric = "economic_output"
delta = -0.2
