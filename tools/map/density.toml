# Regions: unions of parts; a part takes blocks of the listed countries whose representative
# point passes the box, optionally by name, by size, or by the block's dry share.

[regions.italy]
parts = [{ countries = ["ITA", "SMR", "VAT"] }]

[regions.italy_islands]
parts = [{ countries = ["ITA", "SMR", "VAT", "MLT"] },
         { countries = ["FRA"], names = ["Corse-du-Sud", "Haute-Corse"] }]

[regions.italy_cn]
# Piemonte, Valle d'Aosta, Lombardia, Trentino-Alto Adige, Veneto, Friuli-Venezia Giulia,
# Liguria, Emilia-Romagna, Toscana, Umbria, Marche — by their provinces — and San Marino.
parts = [{ countries = ["ITA"], names = [
    "Alessandria", "Asti", "Biella", "Cuneo", "Novara", "Torino", "Verbano-Cusio-Ossola", "Vercelli",
    "Aosta",
    "Bergamo", "Brescia", "Como", "Cremona", "Lecco", "Lodi", "Mantova", "Milano", "Monza e della Brianza",
    "Pavia", "Sondrio", "Varese",
    "Bolzano", "Trento",
    "Belluno", "Padova", "Rovigo", "Treviso", "Venezia", "Verona", "Vicenza",
    "Gorizia", "Pordenone", "Trieste", "Udine",
    "Genova", "Imperia", "La Spezia", "Savona",
    "Bologna", "Ferrara", "Forli'-Cesena", "Modena", "Parma", "Piacenza", "Ravenna", "Reggio nell'Emilia", "Rimini",
    "Arezzo", "Firenze", "Grosseto", "Livorno", "Lucca", "Massa Carrara", "Pisa", "Pistoia", "Prato", "Siena",
    "Perugia", "Terni",
    "Ancona", "Ascoli Piceno", "Fermo", "Macerata", "Pesaro e Urbino"] },
         { countries = ["SMR"] }]

[regions.italy_si]
parts = [{ countries = ["ITA", "VAT", "MLT"] },
         { countries = ["FRA"], names = ["Corse-du-Sud", "Haute-Corse"] }]
minus = ["italy_cn"]

[regions.italy_isole]
# Malanima's Isole: Sicily, Sardinia, Corsica and the minor islands with Malta.
parts = [{ countries = ["ITA"], names = ["Agrigento", "Caltanissetta", "Catania", "Enna", "Messina", "Palermo", "Ragusa",
                                        "Siracusa", "Trapani", "Cagliari", "Nuoro", "Oristano", "Sassari", "Sud Sardegna"] },
         { countries = ["MLT"] },
         { countries = ["FRA"], names = ["Corse-du-Sud", "Haute-Corse"] }]

[regions.italy_sud]
# Malanima's Sud: Lazio, Abruzzo, Molise, Campania, Puglia, Basilicata, Calabria.
parts = [{ countries = ["ITA", "VAT"] }]
minus = ["italy_cn", "italy_isole"]

[regions.tuscany]
parts = [{ countries = ["ITA"], names = ["Arezzo", "Firenze", "Grosseto", "Livorno", "Lucca", "Massa Carrara",
                                        "Pisa", "Pistoia", "Prato", "Siena"] }]

[regions.italy_alps]
# The Italian provinces wholly in the Alps: of the provinces north of 45.5° N, those whose rugged
# share (step 1: relief ≥ 300 m in a window of 5) is at least 0.95 — measured 0.99–1.00; the next
# one, Lecco, is 0.86.
parts = [{ countries = ["ITA"], names = ["Aosta", "Sondrio", "Verbano-Cusio-Ossola", "Bolzano", "Trento", "Belluno"] }]

[regions.iberia]
parts = [{ countries = ["ESP", "PRT", "AND"] }]

[regions.gaul]
parts = [{ countries = ["FRA"], exclude_names = ["Corse-du-Sud", "Haute-Corse"] },
         { countries = ["BEL", "LUX", "NLD", "CHE"] }]

[regions.france_lc]
parts = [{ countries = ["FRA", "BEL", "LUX", "NLD"] }]

[regions.britain_roman]
# England, Wales and the Lowlands south of the Forth–Clyde line, without Northern Ireland.
parts = [{ countries = ["GBR"], lon_min = -5.5, lat_max = 55.8 },
         { countries = ["GBR"], lon_max = -5.5, lat_max = 54.0 }]

[regions.british_isles]
parts = [{ countries = ["GBR", "IRL"] }]

[regions.danube]
# Raetia to Moesia and Dacia: the Danubian lands south of the river, Transdanubia, and Dacia
# (Transylvania, Banat, Oltenia) — approximated by boxes on Hungary and Romania.
parts = [{ countries = ["AUT", "SVN", "HRV", "BIH", "SRB", "XKX", "MNE", "MKD", "BGR"] },
         { countries = ["HUN"], lon_max = 19.0 },
         { countries = ["ROU"], lon_max = 24.5 },
         { countries = ["ROU"], lon_min = 24.5, lon_max = 26.0, lat_min = 45.5 }]

[regions.greece]
parts = [{ countries = ["GRC", "ALB"] }]

[regions.balkans]
# Greece and the Balkans of 1340 with Thrace (European Turkey); Serbia south of the Sava and the
# Danube — Vojvodina is Hungary's (regions.hungary).
parts = [{ countries = ["GRC", "ALB", "MKD", "BGR", "XKX", "MNE", "BIH"] },
         { countries = ["SRB"], lat_max = 44.75 },
         { countries = ["TUR"], lon_max = 29.05, lat_min = 40.4 }]

[regions.asia_minor]
# Roman Asia Minor of 165 — Anatolia west of the upper Euphrates, the frontier of Cappadocia
# (Melitene 38.3° E, Satala 39.6° E): lon < 39° E, with the Pontic coast to Trapezus and Rhizaion
# (lon < 41.6°, lat ≥ 40.55°). Not Armenia and Mesopotamia east of the river.
parts = [{ countries = ["TUR"], lon_min = 29.05, lon_max = 39.0 },
         { countries = ["TUR"], lon_max = 29.05, lat_max = 40.4 },
         { countries = ["TUR"], lon_min = 39.0, lon_max = 41.6, lat_min = 40.55 }]

[regions.hungary]
# The kingdom of Hungary without Croatia: Hungary, Slovakia, Transcarpathia, Romania west of the
# Carpathians (Transylvania, Banat, Crișana, Maramureș — Romania without Wallachia, Moldavia and
# Dobruja, by the boxes of the layouts), Vojvodina with Belgrade.
parts = [{ countries = ["HUN", "SVK"] },
         { countries = ["UKR"], lon_max = 24.7, lat_min = 47.9 },
         { countries = ["SRB"], lat_min = 44.75 },
         { countries = ["ROU"] }]
minus = ["wallachia", "moldavia_rou", "dobruja"]

[regions.wallachia]
parts = [{ countries = ["ROU"], lat_max = 45.3, lon_min = 22.4 }]
minus = ["dobruja"]

[regions.moldavia_rou]
parts = [{ countries = ["ROU"], lon_min = 26.2, lat_min = 45.3 }, { countries = ["ROU"], lon_min = 25.3, lat_min = 47.0 }]

[regions.dobruja]
parts = [{ countries = ["ROU"], lon_min = 28.0, lat_max = 45.3 }]

[regions.syria_settled]
parts = [{ countries = ["SYR", "LBN", "ISR", "PSE", "JOR", "CYP"], max_bw = 0.5 }]

[regions.egypt_valley]
# The valley and the Delta: Egypt's own small units (299 blocks under 500 km², 32.6 thousand
# km²; the source's area is ≈ 30 thousand km²). The desert is in large units of its own.
parts = [{ countries = ["EGY"], max_area_km2 = 500.0 }]

[regions.n_africa]
parts = [{ countries = ["TUN"] },
         { countries = ["DZA"], lat_min = 34.0 },
         { countries = ["MAR"], lat_min = 33.5 },
         { countries = ["LBY"], lon_max = 15.5, lat_min = 31.0 }]

[regions.steppe_pontic]
parts = [{ countries = ["UKR", "RUS", "KAZ"], lon_min = 30.0, lon_max = 56.0, lat_min = 44.0, lat_max = 52.0, min_dry = 0.5 }]

# Lands for the calibration (plan §11a, method (А)). A land is the land of an observation (its
# envelope) unless it is named here with a `region` of its own: such a land has no opened
# ceiling and takes the §4 class (owner's rule 1). `within` nests a land in another: the inner
# land is settled first, and the outer one meets its own ceiling with the units left.
[lands.italy_alps]
region = "italy_alps"
within = "italy_cn"

[lands.tuscany]
within = "italy_cn"

[lands.italy_sud]
within = "italy_si"

[lands.italy_isole]
within = "italy_si"

# The lands of each scenario that its own sources cover whole. A land the scenario covers only
# in part is not calibrated on that part (the part need not have the land's mean): its provinces
# take the §4 class, as rule 1. The scenario's provinces are calibrated at its layout; here, blocks.
[scenarios.constantinople_1430]
# A land this scenario covers only in part takes the capacity its blocks have in the layout of a
# scenario that covers it whole (Italy — milan_1477), and its provinces are calibrated to that.
inherit = "milan_1477"
lands = ["italy_cn", "italy_alps", "italy_si", "italy_sud", "italy_isole", "balkans_1340", "asia_minor_165", "hungary",
         "syria_165", "egypt_165"]
start_population = { italy_cn = 4.2, italy_si = 3.157, italy_sud = 2.220, italy_isole = 0.937, balkans_1340 = 4.5, hungary = 1.5 }
start_population_source = "Malanima 2002, приложение: табл. A.4 (Центр-Север 4,2 млн в 1430 г.), табл. A.3 (Юг с островами 3,28 млн в 1400 г. и 3,075 в 1450 — линейно к 1430 г.; Юг и острова — доли 1600 г., табл. A.7); Russell 1972 (Fordham): Greece/Balkans 4,5 и Hungary 1,5 млн в 1450 г. — ближайшая точка ряда к 1430 г.; Малая Азия, Сирия, Египет — открытого числа нет, заглушка"

[scenarios.milan_1477]
lands = ["italy_cn", "tuscany", "italy_alps", "italy_si", "italy_sud", "italy_isole"]
# Population of the start year by land (millions): the fill at start (plan §7) next to the fill
# at which engine2's growth equals the plague loss.
start_population = { italy_cn = 5.125, tuscany = 0.486, italy_si = 3.407, italy_sud = 2.395, italy_isole = 1.012 }
start_population_source = "Malanima 2002, приложение: табл. A.4 по десятилетиям (Центр-Север 4,95 млн в 1470 г. и 5,20 в 1480; Тоскана 469 и 493 тыс.) и табл. A.3 (Юг с островами 3,075 млн в 1450 г. и 3,69 в 1500) — линейно к 1477 г.; Юг и острова — доли 1600 г. (табл. A.7), способ Маланимы для 1400 и 1500 гг."

# Arable density for the calibration. First — the proposal for the engine (owner via the reviewer,
# plan §11c): the densest land with an opened source at the finer split, the Centre-North,
# 50.0 people per km² in 1330 (Malanima 2002, табл. A.4). Then E0's 40, for comparison. The other
# densities stay at E0.
[calibration]
arable = [50.0, 40.0]
# How a land's provinces get their class (plan §12b): "flip" or "nearest" (density.calibrate_nearest).
method = "flip"
# A land is calibrated only on a scenario that covers it whole (owner's decision on §11b п. 1);
# «whole» — at least this share of the land's area lies in the scenario's provinces of the land.
# milan_1477 covers its lands at 94–100 %.
min_cover = 0.9

# The classification parameters the fit scans (plan §4: «порог и правило сухого климата —
# параметры классификации, выбирать по невязке подгонки»).
[scan]
relief_m = [150.0, 200.0, 300.0, 400.0, 500.0, 600.0, 800.0, 1000.0]
relief_window_cells = [5, 9]
# Irrigated valleys are regions of the source, not a climate class: Egypt's cultivated land.
irrigated_regions = ["egypt_valley"]
steppe_share = [0.5, 0.65, 0.8, 0.95]
# Desert density is not fitted: no region with a source is mostly desert. E0 П1 value.
desert_density = 0.5
# Pseudo-provinces for the province-scale fit: blocks grouped by this lon/lat grid.
grid_deg = [1.0, 2.0]
