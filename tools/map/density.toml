source = "Scheidel 2007, там же"

[[obs]]
id = "syria_165"
region = "syria_settled"
density = [36.0, 43.0]
source = "Scheidel 2007, там же (Syria and Cyprus; площадь источника ≈ 139 тыс. км² — заселённая Сирия без пустыни)"

[[obs]]
id = "egypt_165"
region = "egypt_valley"
density = [167.0, 200.0]
source = "Scheidel 2007, там же (площадь источника ≈ 30 тыс. км² — долина и Дельта)"

[[obs]]
id = "n_africa_165"
region = "n_africa"
density = [17.0, 19.0]
source = "Scheidel 2007, там же (North Africa)"

[[obs]]
id = "italy_1300"
land = "italy"
region = "italy"
population = [12.0, 13.0]
source = "Munro J. H., лекции (Toronto, 2013), §9: Италия ок. 1300 г. ≈ 12,5 млн у потолка — E0 П1, открыл"

