# Observations for the density fit (density.py): the population of a region at its Malthusian
# ceiling, with the source (E0 rule: no row without a source; «по памяти» is marked). The fit
# chooses the land-type densities, and the classification parameters with them, that best
# reproduce these densities from the map's own areas by land type.
#
# `density` — people per km² over the region as the source draws it (a range); `population` —
# millions, divided by the map's area of the region (sources whose regions are modern countries).
# `land` — observations of one land in different years; the envelope keeps the highest (E0 П1:
# capacity is a property of the land, not of the year). Their regions must be one land: at most
# 10 % of the area of their union differs (density.py checks it).
# `opened = false` — the source is «по памяти»: the land is not calibrated (owner's rule 1, §11a).
# `fit = false` — a sub-land of a land the fit already has: for the calibration only.

[[obs]]
id = "italy_165"
land = "italy"
region = "italy_islands"
density = [26.0, 29.0]
source = "Scheidel 2007, CEHGRW, с. 38–86, таблица по провинциям 165 г. (по McEvedy–Jones и Frier) — открыл (вторичное) через tabulae-geographicae.de (2017-06-06); «средняя оценка» Италии 39–42"

