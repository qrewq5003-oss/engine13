    "Alessandria", "Asti", "Biella", "Cuneo", "Novara", "Torino", "Verbano-Cusio-Ossola", "Vercelli",
    "Aosta",
    "Bergamo", "Brescia", "Como", "Cremona", "Lecco", "Lodi", "Mantova", "Milano", "Monza e della Brianza",
    "Pavia", "Sondrio", "Varese",
    "Bolzano", "Trento",
    "Belluno", "Padova", "Rovigo", "Treviso", "Venezia", "Verona", "Vicenza",
    "Gorizia", "Pordenone", "Trieste", "Udine",
    "Genova", "Imperia", "La Spezia", "Savona",
    "Bologna", "Ferrara", "Forli'-Cesena", "Modena", "Parma", "Piacenza", "Ravenna", "Reggio nell'Emilia", "Rimini",
    "Arezzo", "Firenze", "Grosseto", "Livorno", "Lucca", "Massa Carrara", "Pisa", "Pistoia", "Prato", "Siena",
