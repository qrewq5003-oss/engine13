# Lands for the calibration (plan §11a, method (А)). A land is the land of an observation (its
# envelope) unless it is named here with a `region` of its own: such a land has no opened
# ceiling and takes the §4 class (owner's rule 1). `within` nests a land in another: the inner
# land is settled first, and the outer one meets its own ceiling with the units left.
[lands.italy_alps]
region = "italy_alps"
within = "italy_cn"

[lands.tuscany]
within = "italy_cn"

[lands.italy_sud]
within = "italy_si"

[lands.italy_isole]
within = "italy_si"

# The lands of each scenario that its own sources cover whole. A land the scenario covers only
# in part is not calibrated on that part (the part need not have the land's mean): its provinces
# take the §4 class, as rule 1. The scenario's provinces are calibrated at its layout; here, blocks.
[scenarios.constantinople_1430]
# A land this scenario covers only in part takes the capacity its blocks have in the layout of a
# scenario that covers it whole (Italy — milan_1477), and its provinces are calibrated to that.
inherit = "milan_1477"
lands = ["italy_cn", "italy_alps", "italy_si", "italy_sud", "italy_isole", "balkans_1340", "asia_minor_165", "hungary",
         "syria_165", "egypt_165"]
start_population = { italy_cn = 4.2, italy_si = 3.157, italy_sud = 2.220, italy_isole = 0.937, balkans_1340 = 4.5, hungary = 1.5 }
start_population_source = "Malanima 2002, приложение: табл. A.4 (Центр-Север 4,2 млн в 1430 г.), табл. A.3 (Юг с островами 3,28 млн в 1400 г. и 3,075 в 1450 — линейно к 1430 г.; Юг и острова — доли 1600 г., табл. A.7); Russell 1972 (Fordham): Greece/Balkans 4,5 и Hungary 1,5 млн в 1450 г. — ближайшая точка ряда к 1430 г.; Малая Азия, Сирия, Египет — открытого числа нет, заглушка"

[scenarios.rome_375]
# The lands of 165 (Scheidel) and their envelopes: Italy, Gaul and Iberia hold their pre-plague
# highs of 1300–1340, Britain and the Danube their own 165 lows (below Hills — the source is a lower
# bound, §13a п. 4). Beyond the limes (§15a п. 4): Germany, Denmark, Scandinavia and Russia by
# their own sources — Scandinavia and Russia stayed far below Hills before industry, so their
# sources are ceilings and their provinces turn sparse, the coldest first. Persia, Mesopotamia,
# the Caucasus and the rest beyond the limes have no opened ceiling (rule 1). No opened start
# population for 375 — every province carries a stub until E4.
lands = ["italy_cn", "tuscany", "italy_alps", "italy_si", "italy_sud", "italy_isole", "gaul_france", "iberia",
         "britain_roman", "danube_165", "greece_165", "asia_minor_165", "syria_roman", "egypt_165", "n_africa_165",
         "germany", "denmark", "scandinavia", "russia"]

[scenarios.milan_1477]
lands = ["italy_cn", "tuscany", "italy_alps", "italy_si", "italy_sud", "italy_isole"]
# Population of the start year by land (millions): the fill at start (plan §7) next to the fill
# at which engine2's growth equals the plague loss.
start_population = { italy_cn = 5.125, tuscany = 0.486, italy_si = 3.407, italy_sud = 2.395, italy_isole = 1.012 }
start_population_source = "Malanima 2002, приложение: табл. A.4 по десятилетиям (Центр-Север 4,95 млн в 1470 г. и 5,20 в 1480; Тоскана 469 и 493 тыс.) и табл. A.3 (Юг с островами 3,075 млн в 1450 г. и 3,69 в 1500) — линейно к 1477 г.; Юг и острова — доли 1600 г. (табл. A.7), способ Маланимы для 1400 и 1500 гг."

# Arable density for the calibration. First — the proposal for the engine (owner via the reviewer,
# plan §11c): the densest land with an opened source at the finer split, the Centre-North,
# 50.0 people per km² in 1330 (Malanima 2002, табл. A.4). Then E0's 40, for comparison. The other
# densities stay at E0.
[calibration]
arable = [50.0, 40.0]
# How a land's provinces get their class (plan §12b): "flip" or "nearest" (density.calibrate_nearest).
method = "flip"
# A land is calibrated only on a scenario that covers it whole (owner's decision on §11b п. 1);
# «whole» — at least this share of the land's area lies in the scenario's provinces of the land.
# milan_1477 covers its lands at 94–100 %.
min_cover = 0.9
# A land below Hills is a ceiling, not a lower bound, when a later pre-industrial point of it
# (`later` observations) stays under this share of Hills (owner's decision on §15a п. 4): Hungary
# reached ≈ 0.8 of Hills by 1490 (§13a п. 4 — a lower bound); Scandinavia stood at 0.17 of Hills in
# 1700, Russia at about 0.4.
sparse_below = 0.5

# The classification parameters the fit scans (plan §4: «порог и правило сухого климата —
# параметры классификации, выбирать по невязке подгонки»).
[scan]
relief_m = [150.0, 200.0, 300.0, 400.0, 500.0, 600.0, 800.0, 1000.0]
relief_window_cells = [5, 9]
# Irrigated valleys are regions of the source, not a climate class: Egypt's cultivated land.
irrigated_regions = ["egypt_valley"]
steppe_share = [0.5, 0.65, 0.8, 0.95]
# Desert density is not fitted: no region with a source is mostly desert. E0 П1 value.
desert_density = 0.5
# Pseudo-provinces for the province-scale fit: blocks grouped by this lon/lat grid.
grid_deg = [1.0, 2.0]
