[regions.tuscany]
parts = [{ countries = ["ITA"], names = ["Arezzo", "Firenze", "Grosseto", "Livorno", "Lucca", "Massa Carrara",
                                        "Pisa", "Pistoia", "Prato", "Siena"] }]

[regions.italy_alps]
