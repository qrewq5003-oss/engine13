# Regions: unions of parts; a part takes blocks of the listed countries whose representative
# point passes the box, optionally by name, by size, or by the block's dry share.

[regions.italy]
parts = [{ countries = ["ITA", "SMR", "VAT"] }]

[regions.italy_islands]
parts = [{ countries = ["ITA", "SMR", "VAT", "MLT"] },
         { countries = ["FRA"], names = ["Corse-du-Sud", "Haute-Corse"] }]

[regions.iberia]
parts = [{ countries = ["ESP", "PRT", "AND"] }]

[regions.gaul]
parts = [{ countries = ["FRA"], exclude_names = ["Corse-du-Sud", "Haute-Corse"] },
         { countries = ["BEL", "LUX", "NLD", "CHE"] }]

[regions.france_lc]
parts = [{ countries = ["FRA", "BEL", "LUX", "NLD"] }]

[regions.britain_roman]
# England, Wales and the Lowlands south of the Forth–Clyde line, without Northern Ireland.
parts = [{ countries = ["GBR"], lon_min = -5.5, lat_max = 55.8 },
         { countries = ["GBR"], lon_max = -5.5, lat_max = 54.0 }]

[regions.british_isles]
parts = [{ countries = ["GBR", "IRL"] }]

[regions.danube]
# Raetia to Moesia and Dacia: the Danubian lands south of the river, Transdanubia, and Dacia
# (Transylvania, Banat, Oltenia) — approximated by boxes on Hungary and Romania.
parts = [{ countries = ["AUT", "SVN", "HRV", "BIH", "SRB", "XKX", "MNE", "MKD", "BGR"] },
         { countries = ["HUN"], lon_max = 19.0 },
         { countries = ["ROU"], lon_max = 24.5 },
         { countries = ["ROU"], lon_min = 24.5, lon_max = 26.0, lat_min = 45.5 }]

[regions.greece]
parts = [{ countries = ["GRC", "ALB"] }]

[regions.balkans]
# Greece and the Balkans of 1340 with Thrace (European Turkey).
parts = [{ countries = ["GRC", "ALB", "MKD", "BGR", "SRB", "XKX", "MNE", "BIH"] },
         { countries = ["TUR"], lon_max = 29.05, lat_min = 40.4 }]

[regions.asia_minor]
parts = [{ countries = ["TUR"], lon_min = 29.05 },
         { countries = ["TUR"], lon_max = 29.05, lat_max = 40.4 }]

[regions.syria_settled]
parts = [{ countries = ["SYR", "LBN", "ISR", "PSE", "JOR", "CYP"], max_bw = 0.5 }]

[regions.egypt_valley]
# The valley and the Delta: Egypt's own small units (299 blocks under 500 km², 32.6 thousand
# km²; the source's area is ≈ 30 thousand km²). The desert is in large units of its own.
parts = [{ countries = ["EGY"], max_area_km2 = 500.0 }]

[regions.n_africa]
parts = [{ countries = ["TUN"] },
         { countries = ["DZA"], lat_min = 34.0 },
         { countries = ["MAR"], lat_min = 33.5 },
         { countries = ["LBY"], lon_max = 15.5, lat_min = 31.0 }]

[regions.steppe_pontic]
parts = [{ countries = ["UKR", "RUS", "KAZ"], lon_min = 30.0, lon_max = 56.0, lat_min = 44.0, lat_max = 52.0, min_dry = 0.5 }]

# The classification parameters the fit scans (plan §4: «порог и правило сухого климата —
# параметры классификации, выбирать по невязке подгонки»).
[scan]
relief_m = [150.0, 200.0, 300.0, 400.0, 500.0, 600.0, 800.0, 1000.0]
relief_window_cells = [5, 9]
# Irrigated valleys are regions of the source, not a climate class: Egypt's cultivated land.
irrigated_regions = ["egypt_valley"]
steppe_share = [0.5, 0.65, 0.8, 0.95]
# Desert density is not fitted: no region with a source is mostly desert. E0 П1 value.
desert_density = 0.5
# Pseudo-provinces for the province-scale fit: blocks grouped by this lon/lat grid.
grid_deg = [1.0, 2.0]
