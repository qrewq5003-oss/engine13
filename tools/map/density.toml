land = "italy"
region = "italy_islands"
density = [26.0, 29.0]
source = "Scheidel 2007, CEHGRW, с. 38–86, таблица по провинциям 165 г. (по McEvedy–Jones и Frier) — открыл (вторичное) через tabulae-geographicae.de (2017-06-06); «средняя оценка» Италии 39–42"

