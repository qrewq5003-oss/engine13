# share (step 1: relief ≥ 300 m in a window of 5) is at least 0.95 — measured 0.99–1.00; the next
# one, Lecco, is 0.86.
parts = [{ countries = ["ITA"], names = ["Aosta", "Sondrio", "Verbano-Cusio-Ossola", "Bolzano", "Trento", "Belluno"] }]

[regions.iberia]
