# The layout of constantinople_1430 (plan docs/engine2_map.md §3, §8 п. 3): block → province →
# owner at the start — 1430, after the fall of Thessalonica (the old scenario: «Фессалоники
# пали»). Read like milan_1477.toml: provinces in order, a block goes to the first province that
# selects it, a catch-all comes last. Coverage (plan §3): the Balkans, Anatolia, the Aegean and
# the Black Sea (Trebizond, Kaffa), Italy of Venice, Genoa, Milan and the Papacy, Hungary, Serbia;
# edges — Wallachia, Poland-Lithuania, the Mamluks.
#
# Culture and religion — coarse groups (§9a п. 2): italian, greek, south_slavic, albanian,
# turkish, arabic, and for this map hungarian, romanian, west_slavic, east_slavic; catholic,
# orthodox, muslim.

scenario = "constantinople_1430"
start_year = 1430
# The actors of the scenario by E0 (docs/engine2_e0.md §1, §6.2): nine polities and the external
# forces Wallachia, Poland-Lithuania and the Mamluks.
e0_actors = ["byzantium", "ottomans", "venice", "genoa", "milan", "papacy", "hungary", "serbia", "trebizond",
             "wallachia", "poland_lithuania", "mamluks"]

[regions]
lombardia = "Lombardia"
liguria = "Liguria"
veneto = "Veneto"
stato_chiesa = "Stato della Chiesa"
stato_da_mar = "Stato da Mar"
oltremare_genovese = "Oltremare genovese"
romania = "Romania"
rumelia = "Rumelia"
anatolia = "Anatolia"
serbia = "Serbia"
ungheria = "Ungheria"
bosnia = "Bosnia"
principati = "Principati"
mamelucchi = "Sultanato mamelucco"
levante_latino = "Levante latino"

# The seat of each owner on this map. Off the map — a stand-in: Poland-Lithuania (Kraków, Vilnius)
# — Podolia. The Ottoman capital is Adrianople, in Thrace; the Mamluks' — Cairo.
[capitals]
byzantium = "costantinopoli"
ottomans = "tracia"
venice = "venezia"
genoa = "liguria"
milan = "lombardia"
papacy = "roma"
hungary = "ungheria"
serbia = "serbia"
trebizond = "trebisonda"
karaman = "konya"
candar = "candar"
bosnia = "bosnia"
ragusa = "ragusa"
wallachia = "valacchia"
poland_lithuania = "podolia"
mamluks = "egitto"
moldavia = "moldavia"
hospitallers = "rodi"
cyprus = "cipro"

[sources]
shepherd_italy = "Shepherd W. R., Historical Atlas (1911), с. 90, «Italy about 1494» — открыл (UT PCL, shepherd-c-090-091.jpg)"
shepherd_ottoman = "Shepherd 1911, с. 93, «The Ottoman Empire, 1451–1481» (состояние 1451 г., даты — годы перехода к Османам) — открыл (UT PCL, shepherd-c-093.jpg)"
owner_13b = "Решение владельца по §13b п. 4 (2026-10-27): острова Эгеиды и Кипр"
e0_genoa = "E0 §6.2: Генуя — держава моря (Пера, Хиос, Каффа); в 1421–1435 гг. Генуя под синьорией Висконти — по памяти"

