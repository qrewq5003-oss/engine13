# The layout of milan_1477 (plan docs/engine2_map.md §3, §8 п. 2): block → province → owner at
# the start (1477). A province is a union of blocks of the common base; `parts` select blocks the
# way density.toml selects regions (countries, names, lon/lat boxes, `coastal`). Provinces are
# read in order and a block goes to the first province that selects it, so a catch-all comes last.
# Every province names its source; where blocks cut a historical border, `note` records the
# approximation (E0 rule: no row without a source; «по памяти» is marked).
#
# Culture and religion — coarse groups (owner's decision §9a п. 2): italian, french (Occitan and
# French), german, greek, south_slavic, albanian, arabic; catholic, orthodox.

scenario = "milan_1477"
start_year = 1477
# The actors of the scenario by E0 (docs/engine2_e0.md §1, §6.3): the 13 polities, the Ottomans
# (at war with Venice at the start) and France (external force). Owners outside this list are new
# actors with land — the owner's decision.
e0_actors = ["milan", "venice", "florence", "naples", "papacy", "genoa", "ferrara", "mantua", "siena", "urbino",
             "bologna", "savoy", "sicily", "ottomans", "france"]
# The lands calibrated in this scenario and the start population by land — density.toml,
# [scenarios.milan_1477] (plan §11b, §11d).

# Historical areas: the `region` of a province on the map, and the scenario's regions (the
# target of «unite»; E7 may add others).
[regions]
lombardia = "Lombardia"
piemonte = "Piemonte"
savoia = "Savoia"
liguria = "Liguria"
corsica = "Corsica"
veneto = "Veneto"
emilia = "Emilia"
romagna = "Romagna"
marche = "Marche"
umbria = "Umbria"
toscana = "Toscana"
lazio = "Lazio"
regno_napoli = "Regno di Napoli"
sicilia = "Sicilia"
sardegna = "Sardegna"
stato_da_mar = "Stato da Mar"
francia = "Francia"
svizzera = "Svizzera"
austria = "Austria"
balcani = "Balcani"

[sources]
shepherd_italy = "Shepherd W. R., Historical Atlas (1911), с. 90, «Italy about 1494» — открыл (UT PCL, shepherd-c-090-091.jpg)"
shepherd_swiss = "Shepherd 1911, с. 91, «The Swiss Confederation, 1291–1513» — открыл (там же)"
shepherd_ottoman = "Shepherd 1911, с. 93, «The Ottoman Empire, 1451–1481» (даты — годы перехода к Османам) — открыл (UT PCL, shepherd-c-093.jpg)"
shepherd_france = "Shepherd 1911, с. 84, «England and France, 1455–1494» (даты — годы перехода к короне) — открыл (UT PCL, shepherd-c-084.jpg)"
e0_genoa = "E0 §5.6, §6.3: Генуя на старте — вассал Милана (синьория Сфорца 1464–1478), условно до открытия Epstein 1996 — решение владельца"

