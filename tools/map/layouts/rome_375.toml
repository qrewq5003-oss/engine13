# The layout of rome_375 (plan docs/engine2_map.md §3, §8 п. 4): block → province → owner at the
# start, 375 — one Roman state with two courts (Valens and Gratian); `rome_west` and `rome_east`
# are successors only (AGENTS §10). Read like milan_1477.toml: provinces in order, a block goes to
# the first province that selects it, a catch-all comes last. Roman provinces are grouped inside
# their dioceses (plan §3); the Goths are still north of the Danube (Adrianople is 378), Nisibis
# and the lands east of the Tigris are Persian since the peace of 363.
#
# Coverage — all of Europe uncut (owner, 2026-10-27; plan §15): Scandinavia and Finland to the
# North Cape, Russia to the Urals and the Ural river, the whole Caucasus; edges are full actors
# (plan §3). Beyond the edge — only the steppe east of the Ural river, the Huns' rear.
#
# Culture and religion — coarse groups (§9a п. 2; for 375 — the Latin and the Greek halves and so
# on): latin, greek, celtic, aramaic, coptic, berber, germanic, iranian, hunnic, armenian, persian,
# slavic, baltic, finnic, kartvelian, caucasian; christian, pagan, zoroastrian. Majority faith of the Roman provinces — Christian by the middle of
# the 4th century (Stark R., The Rise of Christianity, 1996 — по памяти).

scenario = "rome_375"
start_year = 375
# The actors of the scenario by E0 (docs/engine2_e0.md §6.1): kushans, guptas and eastern_jin are
# removed (owner, 2026-10-13); rome_west / rome_east and the other successors are not at the start.
e0_actors = ["rome", "huns", "visigoths", "ostrogoths", "sassanids", "vandals", "burgundians", "franks",
             "alamanni", "saxons", "berbers", "armenia"]

[regions]
britanniae = "Britanniae"
galliae = "Galliae"
septem_provinciae = "Septem Provinciae"
