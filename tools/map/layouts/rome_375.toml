# The seat of each owner on this map: Rome — Mediolanum, the western court and the seat of the
# Anicii (E0 §6.1); Persia — Ctesiphon.
[capitals]
rome = "liguria"
sassanids = "asorestan"
armenia = "armenia"
huns = "itil"
visigoths = "gothia_dacia"
ostrogoths = "greutungia_w"
vandals = "vandalia"
burgundians = "burgundia"
